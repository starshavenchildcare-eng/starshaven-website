name: Build November Early Years Matter PDF
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: python -m pip install --quiet weasyprint
      - name: Build publication PDF
        run: |
          mkdir -p site/resources/early-years-matter
          weasyprint site/resources/early-years-matter/_november-source.html site/resources/early-years-matter/2026-11-transitions-without-tears.pdf
      - name: Remove old October issue and temporary build files
        run: |
          rm -f site/resources/early-years-matter/2026-10-transitions-without-tears.pdf
          rm site/resources/early-years-matter/_november-source.html
          rm .github/workflows/build-eym-november.yml
      - name: Commit final November publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish November Early Years Matter PDF"
          git push
