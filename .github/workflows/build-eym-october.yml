name: Build October Early Years Matter PDF
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: python -m pip install --quiet weasyprint
      - name: Build publication PDF
        run: |
          mkdir -p site/resources/early-years-matter
          weasyprint site/resources/early-years-matter/_october-source.html site/resources/early-years-matter/2026-10-transitions-without-tears.pdf
      - name: Commit publication and remove temporary build files
        run: |
          rm site/resources/early-years-matter/_october-source.html
          rm .github/workflows/build-eym-october.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/resources/early-years-matter/2026-10-transitions-without-tears.pdf site/resources/early-years-matter/_october-source.html .github/workflows/build-eym-october.yml
          git commit -m "Publish October Early Years Matter PDF"
          git push
